[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "agent-framework-mnemoverse"
dynamic = ["version"]
description = "Mnemoverse long-term memory for Microsoft Agent Framework (Python): a context provider with time-boxed recall and search, save and rate tools."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Mnemoverse" }]
keywords = ["agent-framework", "microsoft-agent-framework", "mnemoverse", "memory", "long-term-memory", "context-provider", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "agent-framework-core>=1.25.0,<2",
    "mnemoverse>=0.5.2,<0.6.0",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    # Only for tests/test_readme.py, which builds the README quickstart offline.
    "agent-framework-openai>=1.18.1,<2",
]

[project.urls]
Homepage = "https://mnemoverse.com"
Documentation = "https://mnemoverse.com/docs/api/python-sdk"
Repository = "https://github.com/mnemoverse/agent-framework-mnemoverse"
Issues = "https://github.com/mnemoverse/agent-framework-mnemoverse/issues"
Changelog = "https://github.com/mnemoverse/agent-framework-mnemoverse/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/agent_framework_mnemoverse/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_framework_mnemoverse"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
